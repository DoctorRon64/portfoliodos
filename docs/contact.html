<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title id="page-title">Loading...</title>
    <link rel="icon" href="/src/assets/img/websiteicon.gif" type="image/x-icon" />
    <link rel="stylesheet" href="/docs/assets/css/app.css" />

    <script type="module">
        import { initContact } from '/src/assets/js/contact.js';
        import { loadLanguage } from '/src/assets/js/lang.js';
        import { tagsMap, tagsIconMap } from '/src/assets/js/tagsMap.js';
        import { createLanguageSwitcher } from '/docs/assets/js/languageSwitcher.js';

        // Wait for DOM to be ready
        document.addEventListener('DOMContentLoaded', async () => {
            const params = new URLSearchParams(location.search);
            const lang = params.get('lang') || 'en';

            try {
                await loadLanguage(lang);
                initContact(lang);

                // Initialize professional language switcher
                const languageSwitcher = createLanguageSwitcher('#language-switcher-container', {
                    currentLang: lang, // Set the current language explicitly
                    onLanguageChange: async (newLang) => {
                        await loadLanguage(newLang);
                        initContact(newLang);
                    },
                    compact: true
                });
            } catch (error) {
                console.error('Failed to initialize contact page:', error);
            }
        });
    </script>
</head>
