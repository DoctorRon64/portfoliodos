<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title> Portfolio</title>
    <link rel="icon" href="/assets/img/websiteicon.gif" type="image/x-icon" />
    <link rel="stylesheet" href="/assets/css/app.css" />

    <script type="module">
        import { init } from '../assets/js/home.js';
        import { loadLanguage } from '../assets/js/lang.js';

        const params = new URLSearchParams(location.search);
        const validKey = 'open';
        window.hasAccess = params.get('key') === validKey;

        if (!window.hasAccess) {
            const style = document.createElement('style');
            style.textContent = `
            body > * {
                display: none !important;
            }
            .access-denied-message {
                display: flex !important;
                justify-content: center;
                align-items: center;
                height: 100vh;
                flex-direction: column;
                font-family: sans-serif;
                background: white;
                color: black;
                margin: 0;
                padding: 2rem;
                text-align: center;
            }
        `;
            document.head.appendChild(style);

            const message = document.createElement('div');
            message.className = 'access-denied-message';
            message.innerHTML = `
            <h2>🔒 Access Denied</h2>
            <p>You don’t have permission to view this portfolio.</p>
        `;
            document.body.appendChild(message);
        } else {
            const lang = params.get('lang') || 'en';
            loadLanguage(lang);
            init();
        }
    </script>
</head>

<body class="home-body">
    <nav class="navbar">
        <div id="nav-logo" class="nav-logo">WebsiteLink</div>
        <div id="nav-links" class="nav-links">
            <a id="nav-projects" class="nav-projects" href="#project-list">Projects</a>
            <a id="nav-about" class="nav-about" href="#about">About</a>
            <a id="nav-contact" class="nav-contact" href="#Contact">Contact</a>
        </div>
    </nav>

    <button onclick="location.search='?key=open&lang=en'">English</button>
    <button onclick="location.search='?key=open&lang=nl'">Nederlands</button>

    <!-- Header -->
    <header class="home-container">
        <div class="home-title" id="header-title">Titel</div>
        <div class="home-subtitle" id="header-subtitle">Subtitle</div>
    </header>

    <!-- Modal -->
    <div id="projectModal" class="modal">
        <div class="modal-content thumbnail"> <!-- reuse .thumbnail here -->
            <button class="close-modal">&times;</button>
            <img src="main-image-url.jpg" alt="Project Main" class="main-image" />
            <div class="small-thumbnails">
                <div class="small-thumb-wrapper" data-title="Thumb 1">
                    <img src="thumb1.jpg" alt="Thumb 1" class="small-thumb" />
                </div>
                <div class="small-thumb-wrapper" data-title="Thumb 2">
                    <img src="thumb2.jpg" alt="Thumb 2" class="small-thumb" />
                </div>
            </div>
            <h2 class="project-title">Project Title</h2>
            <p class="subtitle">Project subtitle or description</p>
            <div class="tags">
                <span class="tag" style="background-color: #e74c3c;">Tag1</span>
                <span class="tag" style="background-color: #3498db;">Tag2</span>
            </div>
            <div class="project-links">
                <a href="#" class="btn btn-github" target="_blank">GitHub</a>
                <a href="#" class="btn btn-itchio" target="_blank">Itch.io</a>
            </div>
            <ul class="extra-info">
                <li><strong>Date:</strong> 2024-01-01</li>
                <li><strong>Duration:</strong> 3 months</li>
                <li><strong>Team Size:</strong> 5</li>
                <li><strong>Status:</strong> Completed</li>
            </ul>
        </div>
    </div>

    <!-- Projects -->
    <section class="home-projects" id="project-list"></section>

    <section id="about" class="about-section">
        <h2 id="about-title">About Me</h2>
        <p id="about-description">
            some text
        </p>
    </section>

    <script>
        async function loadLanguage(lang = 'nl') {
            const response = await fetch('../data/home.json');
            const data = await response.json();
            const text = data[lang];

            document.title = text.title;
            document.getElementById('header-title').textContent = text.headerTitle;
            document.getElementById('header-subtitle').textContent = text.headerSubtitle;

            document.getElementById('nav-projects').textContent = text.nav.projects;
            document.getElementById('nav-about').textContent = text.nav.about;
            document.getElementById('nav-contact').textContent = text.nav.contact;

            document.getElementById('about-title').textContent = text.about.title;
            document.getElementById('about-description').textContent = text.about.description;
        }
    </script>

    <script>
        import { loadLanguage } from '../assets/js/lang.js';
    </script>
</body>

</html>
