    <script type="module">
        console.log('Index.html script starting...');
        import { init } from '/src/assets/js/home.js';
        import { loadLanguage } from '/src/assets/js/lang.js';
        import { createLanguageSwitcher } from '/docs/assets/js/languageSwitcher.js';

        console.log('All imports successful');

        // Wait for DOM to be ready
        document.addEventListener('DOMContentLoaded', async () => {
            console.log('DOMContentLoaded event fired');
            const params = new URLSearchParams(location.search);
            const lang = params.get('lang') || 'en';
            console.log('Language from URL:', lang);

            try {
                console.log('Calling loadLanguage...');
                await loadLanguage(lang);
                console.log('loadLanguage completed, calling init...');
                init(lang);
                console.log('init completed');

                // Initialize professional language switcher AFTER language is loaded
                const languageSwitcher = createLanguageSwitcher('.language-switcher', {
                    currentLang: lang, // Set the current language explicitly
                    onLanguageChange: async (newLang) => {
                        console.log('Language changed to:', newLang);
                        await loadLanguage(newLang);
                        init(newLang);
                    },
                    compact: true
                });
                console.log('Language switcher initialized with language:', lang);
            } catch (error) {
                console.error('Failed to initialize page:', error);
            }
        });
    </script>
</head>
